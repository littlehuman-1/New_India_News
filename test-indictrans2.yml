name: Test IndicTrans2 translations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-indictrans2-en-indic-dist-200M-v1

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.51,<5" accelerate sentencepiece indictranstoolkit

      - name: Test translations in five Indian languages
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python test_indictrans2.py
